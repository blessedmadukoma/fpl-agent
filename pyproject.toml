[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "0.1.0"
description = "Fantasy Premier League projections and transfer optimise"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "fastapi[standard]>=0.162.2",
    "highspy",
    "httpx",
    "jinja2>=3.1.6",
    "langfuse>=4.16.0",
    "markdown-it-py>=4.2.0",
    "numpy",
    "openai>=3.24.0",
    "pandas",
    "pulp",
    "pydantic>=2.13.5",
    "python-dotenv",
    "pytz>=2026.5",
    "scikit-learn",
    "scipy",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpl = "fpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
