[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-agent"
version = "0.1.0"
description = "Fantasy Premier League projections and transfer optimise"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "highspy",
    "httpx",
    "numpy",
    "pandas",
    "pulp",
    "python-dotenv",
    "scikit-learn",
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
fpl = "fpl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
