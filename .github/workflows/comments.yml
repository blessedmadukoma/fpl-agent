name: Comment ratchet

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  comments:
    name: Comment ratchet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pre-commit==4.3.0
      - run: pre-commit run comment-ratchet --all-files
